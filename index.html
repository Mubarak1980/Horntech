<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HornTech</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
    }

    .btn {
      padding: 18px 40px;
      border: 2px solid cyan;
      border-radius: 12px;
      background: transparent;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.4s;
    }

    .btn:hover {
      background: cyan;
      color: black;
      transform: scale(1.1);
      box-shadow: 0 0 30px cyan;
    }
  </style>
</head>

<body>

  <button class="btn">HOVER ME 🚀</button>

</body>
</html>
